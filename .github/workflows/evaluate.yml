name: Reevaluar datos del Metro de Lima
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pulso.pipeline --no-tracking --publish evaluation/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: metro-lima-evaluation
          path: evaluation/report.json
          retention-days: 7
