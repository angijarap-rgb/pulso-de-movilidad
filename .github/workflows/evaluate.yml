name: Reevaluar datos TLC
on:
  workflow_dispatch:
    inputs:
      start:
        description: Primer mes de una ventana de 16 meses publicados (AAAA-MM)
        required: true
        default: '2023-07'
permissions:
  contents: read
concurrency:
  group: tlc-evaluation
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - env:
          START_MONTH: ${{ inputs.start }}
        run: |
          python -m pulso.pipeline --start "$START_MONTH" --no-tracking --publish evaluation/report.json
          python -c 'import json; r=json.load(open("evaluation/report.json")); print(r["decision"]); print(r["metrics"]["test"])' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tlc-evaluation
          path: evaluation/report.json
          retention-days: 7
